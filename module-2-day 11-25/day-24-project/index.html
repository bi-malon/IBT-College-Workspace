<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheger Transit — Multi-Modal Commute</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-layout">
      <header class="header">
        <div class="brand">
          <h1>Sheger Transit</h1>
        </div>
        <div class="header-controls">
          <input
            type="text"
            id="search-input"
            placeholder="Search origin, destination..."
          />
          <button id="theme-toggle" class="theme-btn">Dark Mode</button>
        </div>
      </header>

      <nav class="filter-bar">
        <button class="filter-btn active" data-type="ALL">All Services</button>
        <button class="filter-btn" data-type="Bus">Buses</button>
        <button class="filter-btn" data-type="Ride">Ride / Apps</button>
        <button class="filter-btn" data-type="Taxi">Minibus Taxis</button>
      </nav>
      <section class="map-banner-container">
        <div class="board-header">
          <div class="board-title">
            <span class="live-indicator">● LIVE DEPARTURES</span>
            <h3>Sheger Station Terminal Monitor</h3>
          </div>
          <div id="board-clock" class="board-clock">11:25 EAT</div>
        </div>

        <div class="board-table-wrapper">
          <table class="departure-table">
            <thead>
              <tr>
                <th>TIME</th>
                <th>ROUTE / DESTINATION</th>
                <th>TYPE</th>
                <th>BAY</th>
                <th>STATUS</th>
              </tr>
            </thead>
            <tbody id="departure-board-body">
              <!-- Rows populated dynamically -->
            </tbody>
          </table>
        </div>
      </section>

      <div class="content-grid">
        <main>
          <div id="services-container" class="cards-grid"></div>
        </main>

        <aside class="cart-sidebar card">
          <h2>Saved Commutes</h2>
          <div id="saved-list" class="saved-items"></div>
          <hr />
          <div class="cart-summary">
            <span>Est. Daily Total:</span>
            <strong id="total-fare">0 ETB</strong>
          </div>

          <!-- DAY 24: TeleBirr Checkout Form -->
          <form id="checkout-form" class="checkout-form" novalidate>
            <h3>TeleBirr Checkout</h3>

            <label for="passenger-name">Full Name</label>
            <input
              type="text"
              id="passenger-name"
              placeholder="e.g. Binyam Kiros"
              required
            />

            <label for="passenger-phone">TeleBirr Mobile Number</label>
            <input
              type="tel"
              id="passenger-phone"
              placeholder="0937015998 or +251937015998"
              required
            />

            <label for="delivery-area">Primary Pickup Station</label>
            <select id="delivery-area">
              <option value="Megenagna">Megenagna</option>
              <option value="Bole">Bole</option>
              <option value="Piazza">Piazza</option>
              <option value="Mexico">Mexico</option>
            </select>

            <!-- Dynamic Error Feedback Area -->
            <p id="form-error" class="form-error"></p>

            <button type="submit" id="place-order-btn" class="checkout-btn">
              Confirm & Pay via TeleBirr
            </button>
          </form>

          <!-- Order Confirmation Box -->
          <div id="confirmation-box" class="confirmation-box hidden"></div>
        </aside>
      </div>

      <footer class="footer">
        <p>Sheger Transit — @2026 IBT COLLEGE - Powerd by Binyam Kiros</p>
      </footer>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
